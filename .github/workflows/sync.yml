name: Sync FxTwitter Archive

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync new tweets from Cloudflare
        env:
          API_BASE: https://fxtwitter-archive-api.pages.dev
        run: |
          python <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = os.environ["API_BASE"].rstrip("/")

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "fxtwitter-github-mirror/1.0"}
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def load_json(path, default):
              path = Path(path)
              if not path.exists():
                  return default

              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def save_json(path, data):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

          state = load_json("mirror_state.json", {})
          cursor = str(state.get("last_tweet_id", "0"))

          new_tweets = []

          while True:
              params = {
                  "order": "asc",
                  "limit": "500"
              }

              if cursor != "0":
                  params["since_id"] = cursor

              url = BASE + "/tweets?" + urllib.parse.urlencode(params)

              print("Fetching:", url)

              data = get_json(url)

              if not data.get("ok"):
                  raise RuntimeError(data)

              batch = data.get("results", [])

              if not batch:
                  break

              new_tweets.extend(batch)

              cursor = str(batch[-1]["tweet_id"])

              if len(batch) < 500:
                  break

          print("New tweets:", len(new_tweets))

          if not new_tweets:
              raise SystemExit(0)

          #
          # Archive by UTC day
          #
          grouped = {}

          for tweet in new_tweets:
              day = tweet["created_at"][:10]
              grouped.setdefault(day, []).append(tweet)

          for day, tweets in grouped.items():
              path = Path("archive") / f"{day}.json"

              existing = load_json(
                  path,
                  {
                      "date": day,
                      "tweets": []
                  }
              )

              merged = {
                  str(t["tweet_id"]): t
                  for t in existing.get("tweets", [])
              }

              for tweet in tweets:
                  merged[str(tweet["tweet_id"])] = tweet

              result = list(merged.values())

              result.sort(
                  key=lambda t: t.get("created_timestamp", 0)
              )

              save_json(
                  path,
                  {
                      "date": day,
                      "tweets": result
                  }
              )

          #
          # Keep latest 500 tweets separately
          #
          latest = load_json(
              "latest.json",
              {
                  "tweets": []
              }
          )

          latest_map = {
              str(t["tweet_id"]): t
              for t in latest.get("tweets", [])
          }

          for tweet in new_tweets:
              latest_map[str(tweet["tweet_id"])] = tweet

          latest_tweets = list(latest_map.values())

          latest_tweets.sort(
              key=lambda t: t.get("created_timestamp", 0),
              reverse=True
          )

          latest_tweets = latest_tweets[:500]

          now = datetime.now(timezone.utc).isoformat()

          save_json(
              "latest.json",
              {
                  "updated_at": now,
                  "count": len(latest_tweets),
                  "tweets": latest_tweets
              }
          )

          #
          # Cursor for next run
          #
          save_json(
              "mirror_state.json",
              {
                  "last_tweet_id": cursor,
                  "updated_at": now,
                  "new_tweets_last_sync": len(new_tweets)
              }
          )

          print("Mirror updated successfully.")
          PY

      - name: Commit archive changes
        run: |
          git config user.name "FxTwitter Archive Bot"
          git config user.email "actions@github.com"

          git add archive latest.json mirror_state.json

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Sync tweet archive"
          git push
