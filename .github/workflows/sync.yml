name: Sync FxTwitter Archive

on:
  schedule:
    # Два раза в час, с небольшим сдвигом относительно Cloudflare Worker
    - cron: "7,37 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - full
          - backfill

      date_from:
        description: "Start date YYYY-MM-DD (backfill)"
        required: false
        default: ""

      date_to:
        description: "End date YYYY-MM-DD (backfill)"
        required: false
        default: ""

      days:
        description: "Or last N days (backfill, if dates are empty)"
        required: false
        default: ""

      accounts:
        description: "Accounts separated by commas, e.g. SalsaTekila,DonAlt"
        required: false
        default: ""

      query:
        description: "Text search, e.g. ZEC, BTC, ETH"
        required: false
        default: ""

      media:
        description: "Media filter"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - any
          - photo
          - video
          - gif


permissions:
  contents: write


concurrency:
  group: fxtwitter-archive-sync
  cancel-in-progress: false


env:
  API_BASE: "https://fxtwitter-archive-api.pages.dev"

  # 20 уже проверено — большие ответы давали HTTP 500.
  PAGE_SIZE: "20"

  # При auto дополнительно перечитываем последние 7 дней.
  RECONCILE_DAYS: "7"

  # Удобный файл с последними постами.
  LATEST_LIMIT: "500"


jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync archive from Cloudflare
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          DATE_FROM: ${{ inputs.date_from || '' }}
          DATE_TO: ${{ inputs.date_to || '' }}
          DAYS: ${{ inputs.days || '' }}
          ACCOUNTS: ${{ inputs.accounts || '' }}
          QUERY: ${{ inputs.query || '' }}
          MEDIA: ${{ inputs.media || 'all' }}

        run: |
          python3 <<'PY'

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone
          from pathlib import Path


          # =========================================================
          # CONFIG
          # =========================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")

          PAGE_SIZE = int(
              os.environ.get(
                  "PAGE_SIZE",
                  "20"
              )
          )

          RECONCILE_DAYS = int(
              os.environ.get(
                  "RECONCILE_DAYS",
                  "7"
              )
          )

          LATEST_LIMIT = int(
              os.environ.get(
                  "LATEST_LIMIT",
                  "500"
              )
          )


          MODE = os.environ.get(
              "MODE",
              "auto"
          ).strip().lower()


          DATE_FROM = os.environ.get(
              "DATE_FROM",
              ""
          ).strip()

          DATE_TO = os.environ.get(
              "DATE_TO",
              ""
          ).strip()

          DAYS = os.environ.get(
              "DAYS",
              ""
          ).strip()

          ACCOUNTS = os.environ.get(
              "ACCOUNTS",
              ""
          ).strip()

          QUERY = os.environ.get(
              "QUERY",
              ""
          ).strip()

          MEDIA = os.environ.get(
              "MEDIA",
              "all"
          ).strip().lower()


          # =========================================================
          # TRACKED ACCOUNTS
          # =========================================================

          TRACKED_ACCOUNTS = [
              "Pentosh1",
              "DonAlt",
              "SalsaTekila",
              "HsakaTrades",
              "TedPillows",
              "inmortalcrypto",
              "DaanCrypto",
          ]


          TRACKED_MAP = {
              account.lower(): account
              for account in TRACKED_ACCOUNTS
          }


          # =========================================================
          # FILES
          # =========================================================

          ARCHIVE_DIR = Path(
              "archive"
          )

          STATE_FILE = Path(
              "mirror_state.json"
          )

          LATEST_FILE = Path(
              "latest.json"
          )

          INDEX_FILE = Path(
              "index.json"
          )


          ARCHIVE_DIR.mkdir(
              parents=True,
              exist_ok=True
          )


          # =========================================================
          # JSON HELPERS
          # =========================================================

          def load_json(
              path,
              default
          ):
              path = Path(path)

              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception as exc:
                  print(
                      f"WARNING: "
                      f"cannot read {path}: "
                      f"{exc}"
                  )

                  return default


          def save_json_if_changed(
              path,
              data
          ):
              """
              Записываем файл только если его содержимое
              действительно изменилось.

              Поэтому GitHub не создаёт пустые commits.
              """

              path = Path(path)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )


              content = (
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )
                  + "\n"
              )


              if path.exists():

                  old = path.read_text(
                      encoding="utf-8"
                  )

                  if old == content:
                      return False


              temp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              temp.write_text(
                  content,
                  encoding="utf-8"
              )

              temp.replace(
                  path
              )

              return True


          # =========================================================
          # HTTP
          # =========================================================

          def get_json(
              path,
              params=None,
              attempts=4
          ):
              params = (
                  params
                  or {}
              )


              query = urllib.parse.urlencode(
                  params,
                  doseq=True
              )


              url = (
                  API_BASE
                  + path
              )


              if query:
                  url += (
                      "?"
                      + query
                  )


              last_error = None


              for attempt in range(
                  1,
                  attempts + 1
              ):

                  try:

                      print(
                          f"GET {url}"
                      )


                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                                  "fxtwitter-github-mirror/3.0",

                              "Accept":
                                  "application/json",
                          },
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          return json.load(
                              response
                          )


                  except (
                      urllib.error.HTTPError,
                      urllib.error.URLError,
                      TimeoutError,
                  ) as exc:

                      last_error = exc


                      if attempt >= attempts:
                          break


                      wait = (
                          attempt * 3
                      )


                      print(
                          f"Request failed: "
                          f"{exc}. "
                          f"Retry in {wait}s..."
                      )


                      time.sleep(
                          wait
                      )


              raise RuntimeError(
                  "Cloudflare request failed "
                  f"after {attempts} attempts: "
                  f"{last_error}"
              )


          # =========================================================
          # TWEET ID
          # =========================================================

          def tweet_id_int(
              tweet
          ):

              try:

                  return int(
                      str(
                          tweet.get(
                              "tweet_id"
                          )
                          or tweet.get(
                              "id"
                          )
                      )
                  )

              except Exception:

                  return 0


          def max_tweet_id(
              tweets
          ):

              values = [
                  tweet_id_int(
                      tweet
                  )
                  for tweet
                  in tweets
              ]


              values = [
                  value
                  for value
                  in values
                  if value > 0
              ]


              if not values:
                  return None


              return str(
                  max(values)
              )


          # =========================================================
          # TRACKED ACCOUNT / REPOST NORMALIZATION
          # =========================================================

          def canonical_account(
              name
          ):

              if not name:
                  return None


              return TRACKED_MAP.get(
                  str(name).lower()
              )


          def normalize_tweet(
              tweet
          ):
              """
              FxTwitter возвращает у репоста:

              author = автор оригинального поста
              raw.reposted_by = наш отслеживаемый аккаунт

              Например:

              Hsaka репостнул WatcherGuru

              author.screen_name = WatcherGuru
              tracked_account    = HsakaTrades
              is_repost          = true
              original_author    = WatcherGuru
              reposted_by        = HsakaTrades

              Это позволяет потом отдельно спрашивать:

              - всё из ленты Hsaka
              - только собственные посты Hsaka
              - только репосты Hsaka
              """

              tweet = dict(
                  tweet
              )


              author = (
                  tweet.get(
                      "author"
                  )
                  or {}
              )


              author_handle = (
                  author.get(
                      "screen_name"
                  )
              )


              raw = (
                  tweet.get(
                      "raw"
                  )
                  or {}
              )


              raw_reposted_by = (
                  raw.get(
                      "reposted_by"
                  )
                  or {}
              )


              reposter_handle = (
                  raw_reposted_by.get(
                      "screen_name"
                  )
              )


              tracked_from_reposter = (
                  canonical_account(
                      reposter_handle
                  )
              )


              tracked_from_author = (
                  canonical_account(
                      author_handle
                  )
              )


              tracked_account = (
                  tracked_from_reposter
                  or tracked_from_author
                  or reposter_handle
                  or author_handle
              )


              is_repost = bool(
                  reposter_handle
                  and author_handle
                  and (
                      str(
                          reposter_handle
                      ).lower()
                      !=
                      str(
                          author_handle
                      ).lower()
                  )
              )


              tweet[
                  "tracked_account"
              ] = tracked_account


              tweet[
                  "is_repost"
              ] = is_repost


              tweet[
                  "post_type"
              ] = (
                  "repost"
                  if is_repost
                  else "original"
              )


              if is_repost:

                  tweet[
                      "original_author"
                  ] = {
                      "screen_name":
                          author.get(
                              "screen_name"
                          ),

                      "name":
                          author.get(
                              "name"
                          ),
                  }


                  tweet[
                      "reposted_by"
                  ] = {
                      "screen_name":
                          raw_reposted_by.get(
                              "screen_name"
                          ),

                      "name":
                          raw_reposted_by.get(
                              "name"
                          ),

                      "url":
                          raw_reposted_by.get(
                              "url"
                          ),
                  }


              else:

                  tweet.pop(
                      "original_author",
                      None
                  )

                  tweet.pop(
                      "reposted_by",
                      None
                  )


              return tweet


          # =========================================================
          # API PAGINATION
          # =========================================================

          def fetch_tweets(
              filters=None,
              start_cursor=None
          ):
              """
              Универсальная пагинация.

              Cloudflare отдаёт данные частями по PAGE_SIZE.

              После каждой страницы двигаемся через since_id.
              """

              filters = dict(
                  filters
                  or {}
              )


              cursor = (
                  str(
                      start_cursor
                  )
                  if start_cursor
                  not in (
                      None,
                      "",
                      "0"
                  )
                  else None
              )


              collected = []

              seen_ids = set()

              page = 0


              while True:

                  page += 1


                  params = dict(
                      filters
                  )


                  params[
                      "order"
                  ] = "asc"


                  params[
                      "limit"
                  ] = str(
                      PAGE_SIZE
                  )


                  if cursor:

                      params[
                          "since_id"
                      ] = cursor


                  data = get_json(
                      "/tweets",
                      params
                  )


                  if not data.get(
                      "ok"
                  ):

                      raise RuntimeError(
                          "Cloudflare API returned "
                          + json.dumps(
                              data,
                              ensure_ascii=False
                          )
                      )


                  batch = (
                      data.get(
                          "results"
                      )
                      or []
                  )


                  print(
                      f"Page {page}: "
                      f"{len(batch)} tweets"
                  )


                  if not batch:
                      break


                  fresh_batch = []


                  for tweet in batch:

                      tweet_id = str(
                          tweet.get(
                              "tweet_id"
                          )
                          or tweet.get(
                              "id"
                          )
                          or ""
                      )


                      if not tweet_id:
                          continue


                      if tweet_id in seen_ids:
                          continue


                      seen_ids.add(
                          tweet_id
                      )


                      fresh_batch.append(
                          tweet
                      )


                  if not fresh_batch:

                      raise RuntimeError(
                          "API returned no new "
                          "tweet IDs; stopping "
                          "to prevent infinite loop."
                      )


                  collected.extend(
                      fresh_batch
                  )


                  next_cursor = (
                      max_tweet_id(
                          fresh_batch
                      )
                  )


                  if not next_cursor:

                      raise RuntimeError(
                          "Cannot determine "
                          "tweet cursor."
                      )


                  if (
                      cursor
                      and int(
                          next_cursor
                      )
                      <= int(
                          cursor
                      )
                  ):

                      raise RuntimeError(
                          "Cursor did not advance; "
                          "stopping to prevent "
                          "infinite loop."
                      )


                  cursor = (
                      next_cursor
                  )


                  if len(
                      batch
                  ) < PAGE_SIZE:

                      break


                  time.sleep(
                      0.15
                  )


              return (
                  collected,
                  cursor
              )


          # =========================================================
          # DATE
          # =========================================================

          def tweet_day(
              tweet
          ):

              created_at = (
                  tweet.get(
                      "created_at"
                  )
              )


              if (
                  created_at
                  and len(
                      created_at
                  ) >= 10
              ):

                  return (
                      created_at[
                          :10
                      ]
                  )


              timestamp = (
                  tweet.get(
                      "created_timestamp"
                  )
              )


              if timestamp:

                  try:

                      dt = (
                          datetime.fromtimestamp(
                              int(
                                  timestamp
                              )
                              / 1000,
                              tz=timezone.utc
                          )
                      )


                      return (
                          dt.date()
                          .isoformat()
                      )


                  except Exception:
                      pass


              return None


          # =========================================================
          # MERGE INTO ARCHIVE
          # =========================================================

          def merge_tweets(
              tweets
          ):

              grouped = {}


              for incoming in tweets:

                  tweet = (
                      normalize_tweet(
                          incoming
                      )
                  )


                  tweet_id = str(
                      tweet.get(
                          "tweet_id"
                      )
                      or tweet.get(
                          "id"
                      )
                      or ""
                  )


                  if not tweet_id:

                      print(
                          "WARNING: "
                          "tweet without id skipped"
                      )

                      continue


                  day = tweet_day(
                      tweet
                  )


                  if not day:

                      print(
                          f"WARNING: "
                          f"tweet {tweet_id} "
                          f"has no valid date"
                      )

                      continue


                  grouped.setdefault(
                      day,
                      []
                  ).append(
                      tweet
                  )


              changed_files = 0
              new_records = 0
              updated_records = 0


              for (
                  day,
                  day_tweets
              ) in grouped.items():


                  path = (
                      ARCHIVE_DIR
                      / f"{day}.json"
                  )


                  existing = load_json(
                      path,
                      {
                          "date": day,
                          "tweets": []
                      }
                  )


                  old_map = {}


                  for old_tweet in (
                      existing.get(
                          "tweets",
                          []
                      )
                  ):

                      normalized_old = (
                          normalize_tweet(
                              old_tweet
                          )
                      )


                      old_id = str(
                          normalized_old.get(
                              "tweet_id"
                          )
                          or normalized_old.get(
                              "id"
                          )
                          or ""
                      )


                      if old_id:

                          old_map[
                              old_id
                          ] = (
                              normalized_old
                          )


                  merged = dict(
                      old_map
                  )


                  for tweet in day_tweets:

                      tweet_id = str(
                          tweet.get(
                              "tweet_id"
                          )
                          or tweet.get(
                              "id"
                          )
                      )


                      if (
                          tweet_id
                          not in merged
                      ):

                          new_records += 1


                      elif (
                          merged[
                              tweet_id
                          ]
                          != tweet
                      ):

                          updated_records += 1


                      merged[
                          tweet_id
                      ] = tweet


                  result = list(
                      merged.values()
                  )


                  result.sort(
                      key=lambda item: (
                          item.get(
                              "created_timestamp",
                              0
                          ),
                          tweet_id_int(
                              item
                          ),
                      )
                  )


                  output = {
                      "date": day,
                      "count": len(
                          result
                      ),
                      "tweets": result,
                  }


                  if save_json_if_changed(
                      path,
                      output
                  ):

                      changed_files += 1


              return {
                  "changed_files":
                      changed_files,

                  "new_records":
                      new_records,

                  "updated_records":
                      updated_records,
              }


          # =========================================================
          # UPGRADE EXISTING ARCHIVE
          # =========================================================

          def normalize_existing_archive():
              """
              Старые файлы тоже обновляем до новой схемы.

              Таким образом tracked_account/is_repost появятся
              не только у новых твитов, но и у уже сохранённых.
              """

              changed_files = 0


              for path in sorted(
                  ARCHIVE_DIR.glob(
                      "*.json"
                  )
              ):

                  data = load_json(
                      path,
                      {}
                  )


                  tweets = (
                      data.get(
                          "tweets",
                          []
                      )
                  )


                  normalized = [
                      normalize_tweet(
                          tweet
                      )
                      for tweet
                      in tweets
                  ]


                  normalized.sort(
                      key=lambda item: (
                          item.get(
                              "created_timestamp",
                              0
                          ),
                          tweet_id_int(
                              item
                          ),
                      )
                  )


                  output = {
                      "date":
                          data.get(
                              "date"
                          )
                          or path.stem,

                      "count":
                          len(
                              normalized
                          ),

                      "tweets":
                          normalized,
                  }


                  if save_json_if_changed(
                      path,
                      output
                  ):

                      changed_files += 1


              return (
                  changed_files
              )


          # =========================================================
          # LOCAL ACCOUNT FILTER
          # =========================================================

          def filter_by_accounts(
              tweets,
              accounts_csv
          ):
              """
              Аккаунты фильтруем локально.

              Причина:
              Cloudflare хранит author оригинального твита,
              а у репоста tracked account находится
              в raw.reposted_by.
              """

              if not accounts_csv:
                  return tweets


              requested = {
                  value.strip().lower()
                  for value
                  in accounts_csv.split(
                      ","
                  )
                  if value.strip()
              }


              valid_names = set(
                  TRACKED_MAP.keys()
              )


              unknown = (
                  requested
                  - valid_names
              )


              if unknown:

                  raise RuntimeError(
                      "Unknown tracked account(s): "
                      + ", ".join(
                          sorted(
                              unknown
                          )
                      )
                  )


              result = []


              for incoming in tweets:

                  tweet = (
                      normalize_tweet(
                          incoming
                      )
                  )


                  tracked = str(
                      tweet.get(
                          "tracked_account"
                      )
                      or ""
                  ).lower()


                  if tracked in requested:

                      result.append(
                          tweet
                      )


              return result


          # =========================================================
          # INDEX / LATEST
          # =========================================================

          def rebuild_indexes():

              all_tweets = {}

              dates = []


              account_stats = {
                  account: {
                      "total": 0,
                      "original_posts": 0,
                      "reposts": 0,
                  }
                  for account
                  in TRACKED_ACCOUNTS
              }


              unattributed_tweets = 0


              for path in sorted(
                  ARCHIVE_DIR.glob(
                      "*.json"
                  )
              ):

                  data = load_json(
                      path,
                      {}
                  )


                  tweets = (
                      data.get(
                          "tweets",
                          []
                      )
                  )


                  date_value = (
                      data.get(
                          "date"
                      )
                      or path.stem
                  )


                  dates.append({
                      "date":
                          date_value,

                      "count":
                          len(
                              tweets
                          ),

                      "file":
                          str(
                              path
                          ).replace(
                              "\\",
                              "/"
                          ),
                  })


                  for incoming in tweets:

                      tweet = (
                          normalize_tweet(
                              incoming
                          )
                      )


                      tweet_id = str(
                          tweet.get(
                              "tweet_id"
                          )
                          or tweet.get(
                              "id"
                          )
                          or ""
                      )


                      if not tweet_id:
                          continue


                      all_tweets[
                          tweet_id
                      ] = tweet


                      tracked = (
                          canonical_account(
                              tweet.get(
                                  "tracked_account"
                              )
                          )
                      )


                      if not tracked:

                          unattributed_tweets += 1

                          continue


                      stats = (
                          account_stats[
                              tracked
                          ]
                      )


                      stats[
                          "total"
                      ] += 1


                      if tweet.get(
                          "is_repost"
                      ):

                          stats[
                              "reposts"
                          ] += 1

                      else:

                          stats[
                              "original_posts"
                          ] += 1


              tweets = list(
                  all_tweets.values()
              )


              tweets.sort(
                  key=lambda item: (
                      item.get(
                          "created_timestamp",
                          0
                      ),
                      tweet_id_int(
                          item
                      ),
                  ),
                  reverse=True
              )


              latest = tweets[
                  :LATEST_LIMIT
              ]


              collected_values = [
                  tweet.get(
                      "collected_at"
                  )
                  for tweet
                  in tweets
                  if tweet.get(
                      "collected_at"
                  )
              ]


              latest_collected_at = (
                  max(
                      collected_values
                  )
                  if collected_values
                  else None
              )


              save_json_if_changed(
                  LATEST_FILE,
                  {
                      "updated_at":
                          latest_collected_at,

                      "count":
                          len(
                              latest
                          ),

                      "tweets":
                          latest,
                  }
              )


              dates.sort(
                  key=lambda item:
                      item[
                          "date"
                      ],
                  reverse=True
              )


              simple_counts = {
                  account:
                      stats[
                          "total"
                      ]
                  for (
                      account,
                      stats
                  )
                  in account_stats.items()
              }


              save_json_if_changed(
                  INDEX_FILE,
                  {
                      "updated_at":
                          latest_collected_at,

                      "total_tweets":
                          len(
                              tweets
                          ),

                      "first_date":
                          (
                              dates[-1][
                                  "date"
                              ]
                              if dates
                              else None
                          ),

                      "last_date":
                          (
                              dates[0][
                                  "date"
                              ]
                              if dates
                              else None
                          ),

                      "tracked_accounts":
                          TRACKED_ACCOUNTS,

                      "accounts":
                          simple_counts,

                      "account_stats":
                          account_stats,

                      "unattributed_tweets":
                          unattributed_tweets,

                      "dates":
                          dates,
                  }
              )


              return {
                  "total":
                      len(
                          tweets
                      ),

                  "latest_collected_at":
                      latest_collected_at,

                  "max_tweet_id":
                      (
                          max_tweet_id(
                              tweets
                          )
                          if tweets
                          else None
                      ),
              }


          # =========================================================
          # PREVIOUS STATE
          # =========================================================

          state = load_json(
              STATE_FILE,
              {}
          )


          saved_cursor = str(
              state.get(
                  "last_tweet_id",
                  "0"
              )
          )


          print("")
          print(
              "===================================="
          )
          print(
              "FxTwitter GitHub Mirror v3"
          )
          print(
              "===================================="
          )

          print(
              "Mode:",
              MODE
          )

          print(
              "Saved cursor:",
              saved_cursor
          )

          print("")


          fetched = []

          next_global_cursor = (
              saved_cursor
          )


          # =========================================================
          # AUTO MODE
          # =========================================================

          if MODE == "auto":

              print(
                  "AUTO: fetching new tweets..."
              )


              new_tweets, new_cursor = (
                  fetch_tweets(
                      filters={},
                      start_cursor=saved_cursor
                  )
              )


              if new_cursor:

                  next_global_cursor = str(
                      max(
                          int(
                              saved_cursor
                              or "0"
                          ),
                          int(
                              new_cursor
                          )
                      )
                  )


              print(
                  f"AUTO: "
                  f"{len(new_tweets)} "
                  f"new/cursor tweets"
              )


              # Дополнительно перепроверяем последние N дней.
              if saved_cursor not in (
                  "",
                  "0",
                  None
              ):

                  print(
                      f"AUTO: reconciling "
                      f"last "
                      f"{RECONCILE_DAYS} "
                      f"days..."
                  )


                  recent_tweets, _ = (
                      fetch_tweets(
                          filters={
                              "days":
                                  str(
                                      RECONCILE_DAYS
                                  )
                          },
                          start_cursor=None
                      )
                  )


              else:

                  recent_tweets = []


              combined = {}


              for tweet in (
                  new_tweets
                  + recent_tweets
              ):

                  tweet_id = str(
                      tweet.get(
                          "tweet_id"
                      )
                      or tweet.get(
                          "id"
                      )
                      or ""
                  )


                  if tweet_id:

                      combined[
                          tweet_id
                      ] = tweet


              fetched = list(
                  combined.values()
              )


          # =========================================================
          # FULL MODE
          # =========================================================

          elif MODE == "full":

              print(
                  "FULL: reading complete "
                  "D1 archive..."
              )


              fetched, full_cursor = (
                  fetch_tweets(
                      filters={},
                      start_cursor=None
                  )
              )


              if full_cursor:

                  next_global_cursor = str(
                      full_cursor
                  )


          # =========================================================
          # BACKFILL MODE
          # =========================================================

          elif MODE == "backfill":

              filters = {}


              if DATE_FROM:

                  filters[
                      "from"
                  ] = DATE_FROM


              if DATE_TO:

                  filters[
                      "to"
                  ] = DATE_TO


              # Если указаны даты,
              # DAYS игнорируем.
              if (
                  not DATE_FROM
                  and not DATE_TO
                  and DAYS
              ):

                  try:

                      days_value = int(
                          DAYS
                      )


                      if days_value <= 0:
                          raise ValueError


                      filters[
                          "days"
                      ] = str(
                          days_value
                      )


                  except ValueError:

                      raise RuntimeError(
                          "days must be "
                          "a positive integer"
                      )


              if QUERY:

                  filters[
                      "q"
                  ] = QUERY


              if (
                  MEDIA
                  and MEDIA != "all"
              ):

                  filters[
                      "media"
                  ] = MEDIA


              if (
                  not filters
                  and not ACCOUNTS
              ):

                  raise RuntimeError(
                      "backfill needs at least "
                      "one filter: "
                      "date range, days, "
                      "accounts, query or media"
                  )


              print(
                  "BACKFILL API filters:",
                  json.dumps(
                      filters,
                      ensure_ascii=False
                  )
              )


              fetched, _ = (
                  fetch_tweets(
                      filters=filters,
                      start_cursor=None
                  )
              )


              # Account фильтруем локально,
              # чтобы репосты тоже попадали правильно.
              fetched = (
                  filter_by_accounts(
                      fetched,
                      ACCOUNTS
                  )
              )


              if ACCOUNTS:

                  print(
                      "BACKFILL accounts:",
                      ACCOUNTS,
                      "->",
                      len(
                          fetched
                      ),
                      "tweets"
                  )


          else:

              raise RuntimeError(
                  f"Unknown mode: {MODE}"
              )


          # =========================================================
          # SAVE
          # =========================================================

          print("")

          print(
              f"Fetched total: "
              f"{len(fetched)}"
          )


          merge_result = (
              merge_tweets(
                  fetched
              )
          )


          print(
              "Archive merge:",
              json.dumps(
                  merge_result,
                  ensure_ascii=False
              )
          )


          # Обновляем старые файлы до новой схемы.
          upgraded_files = (
              normalize_existing_archive()
          )


          print(
              "Schema upgraded files:",
              upgraded_files
          )


          archive_info = (
              rebuild_indexes()
          )


          # В full режиме cursor точно ставим
          # на максимальный tweet_id архива.
          if MODE == "full":

              archive_max = (
                  archive_info.get(
                      "max_tweet_id"
                  )
              )


              if archive_max:

                  next_global_cursor = (
                      archive_max
                  )


          # =========================================================
          # STATE
          # =========================================================

          state_output = {
              "last_tweet_id":
                  str(
                      next_global_cursor
                      or "0"
                  ),

              "mirrored_tweets":
                  archive_info[
                      "total"
                  ],

              "latest_collected_at":
                  archive_info[
                      "latest_collected_at"
                  ],

              "page_size":
                  PAGE_SIZE,

              "reconcile_days":
                  RECONCILE_DAYS,

              "schema_version":
                  3,
          }


          save_json_if_changed(
              STATE_FILE,
              state_output
          )


          # =========================================================
          # SUMMARY
          # =========================================================

          print("")

          print(
              "===================================="
          )

          print(
              "SYNC COMPLETE"
          )

          print(
              "===================================="
          )


          print(
              "Mirrored tweets:",
              archive_info[
                  "total"
              ]
          )


          print(
              "Global cursor:",
              state_output[
                  "last_tweet_id"
              ]
          )


          print(
              "New records:",
              merge_result[
                  "new_records"
              ]
          )


          print(
              "Updated records:",
              merge_result[
                  "updated_records"
              ]
          )


          print(
              "Changed day files:",
              merge_result[
                  "changed_files"
              ]
          )


          print(
              "Schema-upgraded files:",
              upgraded_files
          )


          print("")

          PY


      - name: Commit archive changes
        run: |
          set -euo pipefail

          git config user.name "FxTwitter Archive Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Archive is already up to date."
            exit 0
          fi

          git commit -m "Sync FxTwitter archive"

          git push
