          TRACKED_ACCOUNTS = [
              "Pentosh1",
              "DonAlt",
              "SalsaTekila",
              "HsakaTrades",
              "TedPillows",
              "inmortalcrypto",
              "DaanCrypto",
          ]

          TRACKED_MAP = {
              name.lower(): name
              for name in TRACKED_ACCOUNTS
          }

          def canonical_account(name):
              if not name:
                  return None

              return TRACKED_MAP.get(
                  str(name).lower()
              )

          def normalize_tweet(tweet):
              tweet = dict(tweet)

              author = tweet.get("author") or {}
              author_handle = author.get("screen_name")

              raw = tweet.get("raw") or {}
              reposted_by = raw.get("reposted_by") or {}
              reposter_handle = reposted_by.get("screen_name")

              tracked_account = (
                  canonical_account(reposter_handle)
                  or canonical_account(author_handle)
                  or reposter_handle
                  or author_handle
              )

              is_repost = bool(
                  reposter_handle
                  and author_handle
                  and reposter_handle.lower()
                  != author_handle.lower()
              )

              tweet["tracked_account"] = tracked_account
              tweet["is_repost"] = is_repost

              if is_repost:
                  tweet["original_author"] = {
                      "screen_name": author.get("screen_name"),
                      "name": author.get("name"),
                  }

                  tweet["reposted_by"] = {
                      "screen_name": reposted_by.get("screen_name"),
                      "name": reposted_by.get("name"),
                      "url": reposted_by.get("url"),
                  }

              else:
                  tweet.pop("original_author", None)
                  tweet.pop("reposted_by", None)

              return tweet
