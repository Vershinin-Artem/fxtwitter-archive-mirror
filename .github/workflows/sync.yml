name: Sync FxTwitter Archive

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fxtwitter-archive-sync
  cancel-in-progress: false

env:
  FXTWITTER_API_BASE: "https://api.fxtwitter.com"
  PAGES_PER_ACCOUNT: "2"
  LATEST_LIMIT: "200"
  LOOKBACK_HOURS: "72"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Sync 13 FxTwitter accounts
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse
          import urllib.error

          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime


          API = os.getenv(
              "FXTWITTER_API_BASE",
              "https://api.fxtwitter.com"
          ).rstrip("/")

          PAGES = int(
              os.getenv(
                  "PAGES_PER_ACCOUNT",
                  "2"
              )
          )

          LATEST_LIMIT = int(
              os.getenv(
                  "LATEST_LIMIT",
                  "200"
              )
          )

          LOOKBACK_HOURS = int(
              os.getenv(
                  "LOOKBACK_HOURS",
                  "72"
              )
          )


          ACCOUNTS = [
              "Pentosh1",
              "DonAlt",
              "SalsaTekila",
              "HsakaTrades",
              "TedPillows",
              "inmortalcrypto",
              "DaanCrypto",
              "Sheldino_D",
              "CryptoKid",
              "cryptolimbo",
              "DeFi_Paanda",
              "DrProfitCrypto",
              "Alejandro_XBT",
          ]


          ACCOUNT_MAP = {
              x.lower(): x
              for x in ACCOUNTS
          }


          ARCHIVE = Path("archive")
          ARCHIVE.mkdir(
              exist_ok=True
          )


          NOW = datetime.now(
              timezone.utc
          )

          NOW_ISO = (
              NOW
              .isoformat(
                  timespec="milliseconds"
              )
              .replace(
                  "+00:00",
                  "Z"
              )
          )

          CUTOFF = (
              NOW
              - timedelta(
                  hours=LOOKBACK_HOURS
              )
          )


          def load(
              path,
              default
          ):

              try:

                  return json.loads(
                      Path(path)
                      .read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  return default


          def save(
              path,
              obj
          ):

              Path(path).write_text(
                  json.dumps(
                      obj,
                      ensure_ascii=False,
                      indent=2
                  )
                  + "\n",
                  encoding="utf-8"
              )


          def id_int(
              tweet
          ):

              try:

                  return int(
                      str(
                          tweet.get(
                              "tweet_id"
                          )
                          or tweet.get(
                              "id"
                          )
                          or "0"
                      )
                  )

              except Exception:

                  return 0


          def timestamp_ms(
              tweet
          ):

              value = tweet.get(
                  "created_timestamp"
              )

              if value is not None:

                  try:

                      value = int(
                          float(
                              value
                          )
                      )

                      if value >= 10**12:
                          return value

                      return (
                          value
                          * 1000
                      )

                  except Exception:
                      pass


              created_at = tweet.get(
                  "created_at"
              )

              if not created_at:
                  return 0


              try:

                  if "T" in created_at:

                      dt = (
                          datetime
                          .fromisoformat(
                              created_at
                              .replace(
                                  "Z",
                                  "+00:00"
                              )
                          )
                      )

                  else:

                      dt = (
                          parsedate_to_datetime(
                              created_at
                          )
                      )


                  return int(
                      dt.timestamp()
                      * 1000
                  )

              except Exception:

                  return 0


          def request_json(
              url,
              attempts=4
          ):

              last_error = None


              for attempt in range(
                  attempts
              ):

                  try:

                      request = (
                          urllib.request.Request(
                              url,
                              headers={
                                  "User-Agent":
                                      "fxtwitter-github-mirror/4.0",

                                  "Accept":
                                      "application/json",
                              },
                          )
                      )


                      with (
                          urllib.request
                          .urlopen(
                              request,
                              timeout=45
                          )
                          as response
                      ):

                          if (
                              response.status
                              == 204
                          ):

                              return {
                                  "code": 204,
                                  "results": [],
                                  "cursor": {},
                              }


                          data = (
                              json.loads(
                                  response
                                  .read()
                                  .decode(
                                      "utf-8"
                                  )
                              )
                          )


                      if (
                          data.get(
                              "code",
                              200
                          )
                          not in (
                              200,
                              204
                          )
                      ):

                          raise RuntimeError(
                              "API code "
                              f"{data.get('code')}: "
                              f"{data.get('message')}"
                          )


                      return data


                  except (
                      urllib.error.HTTPError
                  ) as error:

                      if (
                          error.code
                          == 204
                      ):

                          return {
                              "code": 204,
                              "results": [],
                              "cursor": {},
                          }


                      try:

                          body = (
                              error
                              .read()
                              .decode(
                                  "utf-8",
                                  "replace"
                              )[
                                  :400
                              ]
                          )

                      except Exception:

                          body = ""


                      last_error = (
                          RuntimeError(
                              f"HTTP "
                              f"{error.code}: "
                              f"{body}"
                          )
                      )


                  except Exception as error:

                      last_error = error


                  if (
                      attempt + 1
                      < attempts
                  ):

                      time.sleep(
                          min(
                              2 ** (
                                  attempt
                                  + 1
                              ),
                              8
                          )
                      )


              raise RuntimeError(
                  str(
                      last_error
                      or "request failed"
                  )
              )


          def fetch_account(
              account
          ):

              output = []
              seen = set()
              cursor = None


              for page in range(
                  PAGES
              ):

                  params = {
                      "count": "100",
                      "with_replies": "0",
                  }


                  if cursor:

                      params[
                          "cursor"
                      ] = cursor


                  url = (
                      f"{API}/2/profile/"
                      f"{urllib.parse.quote(account)}"
                      "/statuses?"
                      + urllib.parse.urlencode(
                          params
                      )
                  )


                  print(
                      f"GET {account} "
                      f"page {page + 1}"
                  )


                  data = (
                      request_json(
                          url
                      )
                  )


                  results = (
                      data.get(
                          "results"
                      )
                      or []
                  )


                  for item in results:

                      if (
                          item.get(
                              "type"
                          )
                          == "thread"
                      ):

                          candidates = (
                              item.get(
                                  "statuses"
                              )
                              or []
                          )

                      else:

                          candidates = [
                              item
                          ]


                      for tweet in candidates:

                          if not isinstance(
                              tweet,
                              dict
                          ):
                              continue


                          if (
                              tweet.get(
                                  "type"
                              )
                              == "tombstone"
                          ):
                              continue


                          tweet_id = str(
                              tweet.get(
                                  "id"
                              )
                              or ""
                          )


                          if (
                              tweet_id
                              and tweet_id
                              not in seen
                          ):

                              seen.add(
                                  tweet_id
                              )

                              output.append(
                                  tweet
                              )


                  bottom = (
                      (
                          data.get(
                              "cursor"
                          )
                          or {}
                      )
                      .get(
                          "bottom"
                      )
                  )


                  if (
                      not bottom
                      or bottom
                      == cursor
                      or not results
                  ):
                      break


                  cursor = bottom

                  time.sleep(
                      0.35
                  )


              return output


          def normalize(
              raw,
              tracked
          ):

              tweet_id = str(
                  raw.get(
                      "id"
                  )
                  or ""
              )


              ts = (
                  timestamp_ms(
                      raw
                  )
              )


              if ts:

                  created_at = (
                      datetime
                      .fromtimestamp(
                          ts / 1000,
                          tz=timezone.utc
                      )
                      .isoformat(
                          timespec="milliseconds"
                      )
                      .replace(
                          "+00:00",
                          "Z"
                      )
                  )

              else:

                  created_at = (
                      raw.get(
                          "created_at"
                      )
                  )


              author = (
                  raw.get(
                      "author"
                  )
                  or {}
              )


              author_screen_name = (
                  author.get(
                      "screen_name"
                  )
              )


              reposted_by = (
                  raw.get(
                      "reposted_by"
                  )
              )


              is_repost = bool(
                  reposted_by
              )


              if (
                  not is_repost
                  and author_screen_name
              ):

                  is_repost = (
                      author_screen_name
                      .lower()
                      != tracked.lower()
                  )


              media = (
                  raw.get(
                      "media"
                  )
                  if isinstance(
                      raw.get(
                          "media"
                      ),
                      dict
                  )
                  else {}
              )


              media = dict(
                  media
                  or {}
              )

              media.setdefault(
                  "photos",
                  []
              )

              media.setdefault(
                  "videos",
                  []
              )

              media.setdefault(
                  "external",
                  []
              )


              tweet = {
                  "tweet_id":
                      tweet_id,

                  "id":
                      tweet_id,

                  "author": {
                      "screen_name":
                          author_screen_name,

                      "name":
                          author.get(
                              "name"
                          ),
                  },

                  "created_at":
                      created_at,

                  "created_timestamp":
                      ts,

                  "text":
                      raw.get(
                          "text"
                      )
                      or "",

                  "url":
                      raw.get(
                          "url"
                      )
                      or (
                          f"https://x.com/"
                          f"{author_screen_name}"
                          f"/status/"
                          f"{tweet_id}"

                          if author_screen_name
                          else None
                      ),

                  "lang":
                      raw.get(
                          "lang"
                      ),

                  "likes":
                      raw.get(
                          "likes"
                      ),

                  "reposts":
                      raw.get(
                          "reposts"
                      ),

                  "quotes":
                      raw.get(
                          "quotes"
                      ),

                  "replies":
                      raw.get(
                          "replies"
                      ),

                  "views":
                      raw.get(
                          "views"
                      ),

                  "quote":
                      raw.get(
                          "quote"
                      ),

                  "media":
                      media,

                  "collected_at":
                      NOW_ISO,

                  "raw":
                      raw,

                  "tracked_account":
                      tracked,

                  "is_repost":
                      is_repost,

                  "post_type":
                      (
                          "repost"
                          if is_repost
                          else "original"
                      ),
              }


              if is_repost:

                  tweet[
                      "repost_original_author"
                  ] = author_screen_name


              return tweet


          existing_ids = set()


          for path in (
              ARCHIVE.glob(
                  "*.json"
              )
          ):

              document = load(
                  path,
                  {}
              )


              for tweet in (
                  document.get(
                      "tweets"
                  )
                  or []
              ):

                  tweet_id = str(
                      tweet.get(
                          "tweet_id"
                      )
                      or tweet.get(
                          "id"
                      )
                      or ""
                  )


                  if tweet_id:

                      existing_ids.add(
                          tweet_id
                      )


          health = {}
          new_ids = []
          ok_count = 0


          for account in ACCOUNTS:

              try:

                  raw_tweets = (
                      fetch_account(
                          account
                      )
                  )


                  ok_count += 1
                  added = 0


                  for raw in raw_tweets:

                      tweet = normalize(
                          raw,
                          account
                      )


                      tweet_id = (
                          tweet[
                              "tweet_id"
                          ]
                      )


                      if (
                          not tweet_id
                          or tweet_id
                          in existing_ids
                      ):
                          continue


                      ts = (
                          tweet[
                              "created_timestamp"
                          ]
                      )


                      if ts:

                          created_dt = (
                              datetime
                              .fromtimestamp(
                                  ts / 1000,
                                  tz=timezone.utc
                              )
                          )


                          if (
                              created_dt
                              < CUTOFF
                          ):
                              continue


                      day = (
                          (
                              tweet.get(
                                  "created_at"
                              )
                              or NOW_ISO
                          )[
                              :10
                          ]
                      )


                      path = (
                          ARCHIVE
                          / f"{day}.json"
                      )


                      document = load(
                          path,
                          {
                              "date":
                                  day,

                              "count":
                                  0,

                              "tweets":
                                  [],
                          }
                      )


                      tweets = (
                          document.get(
                              "tweets"
                          )
                          or []
                      )


                      tweets.append(
                          tweet
                      )


                      tweets.sort(
                          key=lambda x: (
                              x.get(
                                  "created_timestamp"
                              )
                              or 0,

                              id_int(
                                  x
                              ),
                          )
                      )


                      save(
                          path,
                          {
                              "date":
                                  day,

                              "count":
                                  len(
                                      tweets
                                  ),

                              "tweets":
                                  tweets,
                          }
                      )


                      existing_ids.add(
                          tweet_id
                      )


                      new_ids.append(
                          tweet_id
                      )


                      added += 1


                  health[
                      account
                  ] = {
                      "ok":
                          True,

                      "fetched":
                          len(
                              raw_tweets
                          ),

                      "new":
                          added,

                      "error":
                          None,
                  }


                  print(
                      f"{account}: "
                      f"fetched="
                      f"{len(raw_tweets)} "
                      f"new={added}"
                  )


              except Exception as error:

                  health[
                      account
                  ] = {
                      "ok":
                          False,

                      "fetched":
                          0,

                      "new":
                          0,

                      "error":
                          str(
                              error
                          ),
                  }


                  print(
                      "::warning "
                      f"title=FxTwitter "
                      f"{account}::"
                      f"{error}"
                  )


              time.sleep(
                  0.35
              )


          if (
              ok_count
              == 0
          ):

              raise RuntimeError(
                  "All 13 account checks "
                  "failed; not publishing "
                  "fake-fresh data"
              )


          all_by_id = {}
          dates = []


          stats = {
              account: {
                  "total":
                      0,

                  "original_posts":
                      0,

                  "reposts":
                      0,
              }

              for account
              in ACCOUNTS
          }


          unattributed = 0


          for path in sorted(
              ARCHIVE.glob(
                  "*.json"
              )
          ):

              document = load(
                  path,
                  {}
              )


              tweets = (
                  document.get(
                      "tweets"
                  )
                  or []
              )


              dates.append(
                  {
                      "date":
                          document.get(
                              "date"
                          )
                          or path.stem,

                      "count":
                          len(
                              tweets
                          ),

                      "file":
                          str(
                              path
                          )
                          .replace(
                              "\\",
                              "/"
                          ),
                  }
              )


              for tweet in tweets:

                  tweet_id = str(
                      tweet.get(
                          "tweet_id"
                      )
                      or tweet.get(
                          "id"
                      )
                      or ""
                  )


                  if tweet_id:

                      all_by_id[
                          tweet_id
                      ] = tweet


          all_tweets = list(
              all_by_id.values()
          )


          all_tweets.sort(
              key=lambda x: (
                  x.get(
                      "created_timestamp"
                  )
                  or 0,

                  id_int(
                      x
                  ),
              ),
              reverse=True
          )


          for tweet in all_tweets:

              tracked = (
                  ACCOUNT_MAP.get(
                      str(
                          tweet.get(
                              "tracked_account"
                          )
                          or ""
                      )
                      .lower()
                  )
              )


              if not tracked:

                  tracked = (
                      ACCOUNT_MAP.get(
                          str(
                              (
                                  tweet.get(
                                      "author"
                                  )
                                  or {}
                              )
                              .get(
                                  "screen_name"
                              )
                              or ""
                          )
                          .lower()
                      )
                  )


              if not tracked:

                  unattributed += 1
                  continue


              stats[
                  tracked
              ][
                  "total"
              ] += 1


              if tweet.get(
                  "is_repost"
              ):

                  stats[
                      tracked
                  ][
                      "reposts"
                  ] += 1

              else:

                  stats[
                      tracked
                  ][
                      "original_posts"
                  ] += 1


          dates.sort(
              key=lambda x:
                  x[
                      "date"
                  ],
              reverse=True
          )


          latest = (
              all_tweets[
                  :LATEST_LIMIT
              ]
          )


          latest_created = (
              latest[
                  0
              ]
              .get(
                  "created_at"
              )

              if latest
              else None
          )


          latest_collected = max(
              (
                  tweet.get(
                      "collected_at"
                  )

                  for tweet
                  in all_tweets

                  if tweet.get(
                      "collected_at"
                  )
              ),
              default=None
          )


          save(
              "latest.json",
              {
                  "updated_at":
                      NOW_ISO,

                  "latest_tweet_created_at":
                      latest_created,

                  "count":
                      len(
                          latest
                      ),

                  "tweets":
                      latest,
              }
          )


          save(
              "index.json",
              {
                  "updated_at":
                      NOW_ISO,

                  "latest_tweet_collected_at":
                      latest_collected,

                  "latest_tweet_created_at":
                      latest_created,

                  "total_tweets":
                      len(
                          all_tweets
                      ),

                  "first_date":
                      (
                          dates[
                              -1
                          ][
                              "date"
                          ]

                          if dates
                          else None
                      ),

                  "last_date":
                      (
                          dates[
                              0
                          ][
                              "date"
                          ]

                          if dates
                          else None
                      ),

                  "tracked_accounts":
                      ACCOUNTS,

                  "accounts": {
                      account:
                          stats[
                              account
                          ][
                              "total"
                          ]

                      for account
                      in ACCOUNTS
                  },

                  "account_stats":
                      stats,

                  "unattributed_tweets":
                      unattributed,

                  "dates":
                      dates,
              }
          )


          save(
              "mirror_health.json",
              {
                  "checked_at":
                      NOW_ISO,

                  "status":
                      (
                          "ok"
                          if ok_count
                          == len(
                              ACCOUNTS
                          )
                          else "partial"
                      ),

                  "source":
                      "direct_fxtwitter",

                  "successful_accounts":
                      ok_count,

                  "required_accounts":
                      len(
                          ACCOUNTS
                      ),

                  "accounts":
                      health,
              }
          )


          save(
              "mirror_state.json",
              {
                  "last_check_at":
                      NOW_ISO,

                  "source":
                      "direct_fxtwitter",

                  "successful_accounts":
                      ok_count,

                  "new_tweets_this_run":
                      len(
                          new_ids
                      ),

                  "new_tweet_ids":
                      new_ids,
              }
          )


          print(
              f"DONE: checked "
              f"{ok_count}/13, "
              f"new={len(new_ids)}, "
              f"total={len(all_tweets)}"
          )
          PY

      - name: Commit archive changes
        run: |
          set -euo pipefail

          git config user.name "FxTwitter Archive Bot"
          git config user.email "actions@github.com"

          git add \
            archive \
            index.json \
            latest.json \
            mirror_state.json \
            mirror_health.json

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Sync FxTwitter archive"

          for attempt in 1 2 3; do

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            echo "Remote main advanced; rebasing..."

            git fetch origin main
            git rebase origin/main

          done
